<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Data Siswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top Navbar -->
    <nav id="navbar" class="navbar hidden">
      <div class="navbar-inner">
        <a href="#" class="nav-brand" onclick="router.navigate('dashboard')">
          <img src="logo/logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
          <span>Data Siswa</span>
        </a>
        <div class="nav-menu" id="navMenu">
          <a href="#" onclick="router.navigate('dashboard')" data-role="all" data-page="dashboard">Dashboard</a>
          <a href="#" onclick="router.navigate('siswa')" data-role="admin" data-page="siswa">Siswa</a>
          <a href="#" onclick="router.navigate('absensi')" data-role="admin,siswa,orang_tua" data-page="absensi">Absensi</a>
          <a href="#" onclick="router.navigate('raport')" data-role="admin,siswa,orang_tua" data-page="raport">Raport</a>
          <a href="#" onclick="router.navigate('ijin')" data-role="admin,siswa,orang_tua" data-page="ijin">Izin/Sakit</a>
          <a href="#" onclick="router.navigate('admin')" data-role="admin" data-page="admin">Admin</a>
          <a href="#" onclick="auth.logout()" class="nav-logout">Keluar</a>
        </div>
        <button class="nav-toggle" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
      </div>
    </nav>

    <!-- Page content -->
    <main id="main-content">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Memuat...</p>
      </div>
      <div id="page-content"></div>
    </main>

    <!-- Toast -->
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <!-- Core -->
  <script src="js/config.js"></script>
  <script src="js/core/eventBus.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Services -->
  <script src="js/services/baseService.js"></script>
  <script src="js/services/siswaService.js"></script>
  <script src="js/services/absensiService.js"></script>
  <script src="js/services/nilaiService.js"></script>
  <script src="js/services/ijinService.js"></script>
  <script src="js/services/userService.js"></script>
  <script src="js/services/kelasService.js"></script>

  <!-- Components -->
  <script src="js/components/modal.js"></script>
  <script src="js/components/dataTable.js"></script>

  <!-- Pages -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/siswa.js"></script>
  <script src="js/pages/absensi.js"></script>
  <script src="js/pages/raport.js"></script>
  <script src="js/pages/ijin.js"></script>
  <script src="js/pages/admin.js"></script>

  <!-- App entry -->
  <script src="js/app.js"></script>
</body>
</html>
