<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Siswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <nav id="navbar" class="navbar hidden">
      <div class="nav-container">
        <a href="#" class="nav-brand" onclick="router.navigate('dashboard')">
          <img src="logo/logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'"> Data Siswa
        </a>
        <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
        <div class="nav-menu" id="navMenu">
          <a href="#" onclick="router.navigate('dashboard')" data-role="all">Dashboard</a>
          <a href="#" onclick="router.navigate('siswa')" data-role="admin">Siswa</a>
          <a href="#" onclick="router.navigate('absensi')" data-role="admin,siswa,orang_tua">Absensi</a>
          <a href="#" onclick="router.navigate('raport')" data-role="admin,siswa,orang_tua">Raport</a>
          <a href="#" onclick="router.navigate('ijin')" data-role="admin,siswa,orang_tua">Izin/Sakit</a>
          <a href="#" onclick="router.navigate('admin')" data-role="admin">Admin</a>
          <a href="#" onclick="auth.logout()">Logout</a>
        </div>
      </div>
    </nav>
    <main id="main-content">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Memuat...</p>
      </div>
      <div id="page-content"></div>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/siswa.js"></script>
  <script src="js/pages/absensi.js"></script>
  <script src="js/pages/raport.js"></script>
  <script src="js/pages/ijin.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
